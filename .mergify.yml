pull_request_rules:
  - name: Automatic merge on approval
    conditions:
      - base = main
      # A bot approval must not bypass the Renovate eligibility rules below.
      - approved-reviews-by ~= ^(?!.*\[bot\]$).+
      - "#changes-requested-reviews-by = 0"
      - check-success = Pre-commit checks
      - check-success = Validate PR title
      - -draft
      - label != do-not-merge
    actions:
      merge:
        method: squash

  - name: Automatically approve eligible Renovate PRs
    conditions:
      - base = main
      - author = renovate[bot]
      - check-success = Pre-commit checks
      - check-success = Validate PR title
      - "#changes-requested-reviews-by = 0"
      - -draft
      - label != do-not-merge
      - label = automerge-candidate
      - label != update-major
      - label != breaking-change
    actions:
      review:
        type: APPROVE
        message: Automatically approved (safe Renovate update)

  - name: Automatic merge Renovate PRs (safe updates)
    conditions:
      - base = main
      - author = renovate[bot]
      - check-success = Pre-commit checks
      - check-success = Validate PR title
      - "#changes-requested-reviews-by = 0"
      - -draft
      - label != do-not-merge
      - label = automerge-candidate
      - label != update-major
      - label != breaking-change
    actions:
      merge:
        method: squash

  - name: Automatic merge on approval release
    conditions:
      - base = release
      - approved-reviews-by ~= ^(?!.*\[bot\]$).+
      - "#changes-requested-reviews-by = 0"
      - check-success = Pre-commit checks
      - check-success = Validate PR title
      - -draft
      - label != do-not-merge
    actions:
      merge:
        method: merge
merge_protections_settings:
  reporting_method: check-runs
