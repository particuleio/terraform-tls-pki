name: Validate PR title

on:
  # Metadata only: this workflow never checks out or executes pull-request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- validates only the PR title
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate conventional PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            refactor
            test
            ci
            chore
          requireScope: false
          wip: true
          validateSingleCommit: false
